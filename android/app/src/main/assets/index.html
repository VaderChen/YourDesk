<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YourDesk</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="quick"><div class="brand"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M10 17v4m4-4v4"/></svg></span><span data-i18n="brand"></span></div><form id="quick-form"><input id="address" data-placeholder="address" required autocomplete="off"><select id="quick-mode" aria-label="連線模式"><option value="desktop">遠端桌面</option><option value="shell">Shell</option></select><button class="connect" data-i18n="connect"></button></form><div class="language-menu"><button id="language-select" type="button">AUTO</button><div id="language-options" hidden><button data-value="auto">AUTO</button><button data-value="zh-Hant">繁體中文</button><button data-value="en">English</button><button data-value="ja">日本語</button><button data-value="ko">한국어</button></div></div><button class="primary" id="add" data-i18n="add"></button></header>
<div id="site-dialog" class="overlay" hidden><form id="site-form" class="notice-card" role="dialog" aria-modal="true"><h3 id="site-title">新增站台</h3><div class="site-tabs"><button type="button" class="active" data-tab="manual">手動輸入</button><button type="button" data-tab="qrcode">QRCODE 掃描</button></div><section id="site-manual"><label>站台名稱<input id="site-name" maxlength="120" required autocomplete="off"></label><label>遠端 ID 或 IP:Port<input id="site-room" maxlength="255" required autocomplete="off"></label><label>信令伺服器（留白使用預設）<input id="site-signal" maxlength="2048" placeholder="wss://example.com/ws" autocomplete="off" autocapitalize="off" spellcheck="false"></label><label>備註<input id="site-note" maxlength="1024" autocomplete="off"></label><label>連線密碼（選填）<input id="site-secret" type="password" maxlength="4096" autocomplete="off"></label><label class="remember"><input id="site-forget" type="checkbox">清除此端點已儲存的密碼</label></section><section id="site-qrcode" hidden><img id="site-camera" alt="相機預覽" /><label>QR Code 內容<input id="site-qr" placeholder="貼上 yourdesk://site?..." autocomplete="off"></label><button id="scan-again" type="button">重新掃描</button><p>僅接受 YourDesk v1 站台連結。QR Code 不含連線密碼。</p></section><p id="site-status" role="alert"></p><div class="site-actions"><button type="button" id="site-cancel">取消</button><button type="submit">儲存站台</button></div></form></div>
<div id="connect-overlay" class="overlay" hidden><form id="connection-form" class="notice-card" role="dialog" aria-modal="true" aria-labelledby="connect-title"><h3 id="connect-title">連線</h3><label>遠端 ID 或 IP:Port<input id="connect-room" required autocomplete="off"></label><label>連線密碼<input id="connect-secret" type="password" required autocomplete="off"></label><label class="remember"><input id="connect-remember" type="checkbox">記住我</label><p id="connect-status" role="alert"></p><button id="connect-cancel" type="button">取消</button><button id="connect-start" type="submit">連接</button></form></div>
<div id="connect-progress" class="overlay" hidden><div class="notice-card" role="dialog" aria-modal="true"><span class="connection-spinner" aria-hidden="true"></span><h3>正在認證並建立連線</h3><p>已等待 <span id="connect-elapsed">0</span> 秒</p><button id="connect-abort" type="button">中止</button></div></div>
<main><div class="list-header"><div class="heading"><h1 data-i18n="all"></h1><span id="count"></span></div><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" data-placeholder="search"></label></div><div id="sites"></div><p id="empty" hidden data-i18n="empty"></p><footer><span id="app-version"></span><span>Android Viewer · 遠端桌面與 Shell</span></footer></main>
<div id="notice" class="overlay" hidden><div class="notice-card"><p id="message"></p><button id="notice-close" data-i18n="close"></button></div></div>
<div id="delete-dialog" class="overlay" hidden><div class="notice-card" role="dialog" aria-modal="true" aria-labelledby="delete-title"><h3 id="delete-title">刪除站台</h3><p>確定刪除「<strong id="delete-name"></strong>」及其已儲存的密碼？</p><p id="delete-status" role="alert"></p><div class="site-actions"><button id="delete-cancel" type="button">取消</button><button id="delete-confirm" type="button">刪除</button></div></div></div>
<script src="site-model.js"></script><script src="connection.js"></script><script src="app.js"></script></body></html>
