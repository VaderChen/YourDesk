<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YourDesk</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="quick"><div class="brand"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M10 17v4m4-4v4"/></svg></span><span data-i18n="brand"></span></div><form id="quick-form"><input id="address" data-placeholder="address" required autocomplete="off"><button class="connect" data-i18n="connect"></button></form><div class="language-menu"><button id="language-select" type="button">AUTO</button><div id="language-options" hidden><button data-value="auto">AUTO</button><button data-value="zh-Hant">繁體中文</button><button data-value="en">English</button><button data-value="ja">日本語</button><button data-value="ko">한국어</button></div></div><button class="primary" id="add" data-i18n="add"></button></header>
<div id="connect-overlay" class="overlay" hidden><form id="connection-form" class="notice-card" role="dialog" aria-modal="true" aria-labelledby="connect-title"><h3 id="connect-title">連線</h3><label>遠端 ID 或 IP:Port<input id="connect-room" required autocomplete="off"></label><label>連線密碼<input id="connect-secret" type="password" required autocomplete="off"></label><label class="remember"><input id="connect-remember" type="checkbox">記住我</label><p id="connect-status" role="alert"></p><button id="connect-cancel" type="button">取消</button><button id="connect-start" type="submit">連接</button></form></div>
<div id="connect-progress" class="overlay" hidden><div class="notice-card" role="dialog" aria-modal="true"><span class="connection-spinner" aria-hidden="true"></span><h3>正在認證並建立連線</h3><p>已等待 <span id="connect-elapsed">0</span> 秒</p><button id="connect-abort" type="button">中止</button></div></div>
<main><div class="list-header"><div class="heading"><h1 data-i18n="all"></h1><span id="count"></span></div><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" data-placeholder="search"></label></div><div id="sites"></div><p id="empty" hidden data-i18n="empty"></p><footer><span data-i18n="preview"></span></footer></main>
<div id="notice" class="overlay" hidden><div class="notice-card"><p id="message"></p><button id="notice-close" data-i18n="close"></button></div></div>
<script src="connection.js"></script><script src="app.js"></script></body></html>
